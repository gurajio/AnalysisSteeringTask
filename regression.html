<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steering Lab — 回帰モデル</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#1b3539;background:#f2f5f3;font-size:14px}*{box-sizing:border-box}body{margin:0}header{padding:26px 32px;background:#153e41;color:white;display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:25px;margin:5px 0}header small{letter-spacing:.2em;color:#aad0c7}.header-side{text-align:right;display:grid;gap:10px}.nav{color:white;text-decoration:none;border:1px solid #7ba69e;border-radius:7px;padding:8px 12px}.nav:hover{background:#28575a}button,select,input[type=number]{font:inherit;border:1px solid #bfd0ca;border-radius:7px;padding:9px 12px;background:white;color:#173e41}button{cursor:pointer}button:hover{background:#e7f4ee}button:disabled{opacity:.45;cursor:wait}.layout{display:grid;grid-template-columns:275px 1fr;gap:22px;padding:24px}aside{background:white;border:1px solid #dce6e1;border-radius:12px;padding:20px;align-self:start;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}main{min-width:0}h2{font-size:16px;margin:0 0 16px}h3{font-size:15px}fieldset{border:0;padding:0;margin:22px 0}legend{font-weight:600;margin-bottom:10px}.participants{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.participant-group{min-width:0}.participant-group h3{color:#087f73;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid #dce6e1}.participant-list{display:grid;gap:10px}.check{display:flex;gap:6px;align-items:center}input{accent-color:#087f73}.field{display:grid;gap:8px;margin:16px 0}.field select,.field input{width:100%;min-width:0}.muted{color:#60736e;font-size:12px;line-height:1.8}.primary{background:#087f73;color:white;border:0;width:100%;padding:13px}.primary:hover{background:#096a61}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.panel{background:white;border:1px solid #dce6e1;border-radius:12px;padding:20px;margin-bottom:18px}.value{font-size:27px;font-weight:650;margin-top:10px}.model{margin-bottom:24px}.formula{font-family:Georgia,"Times New Roman",serif;font-size:18px;color:#315b5c}.chart img{width:100%;display:block}.chart-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.chart-head h2{margin:0}.table-wrap{overflow:auto;margin-top:14px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}td,th{text-align:right;padding:11px;border-bottom:1px solid #e6ece8}th{color:#60736e}td:first-child,th:first-child{text-align:left}#status{padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#b7352b}.controls{display:flex;gap:8px;margin:10px 0}#result.stale{opacity:.4;pointer-events:none}@media(max-width:1000px){.layout{grid-template-columns:235px 1fr}.cards{grid-template-columns:1fr}}@media(max-width:700px){.layout{display:block;padding:12px}aside{position:static;margin-bottom:18px;max-height:none}header{padding:20px}.cards{grid-template-columns:repeat(3,1fr)}}
</style>
<header><div><small>STEERING LAB / REGRESSION</small><h1>MT回帰モデルの比較</h1><div>同じ対象データへ7種類の習熟曲線を当てはめる。</div></div><div class="header-side"><span id="dataset">読み込み中</span><a class="nav" href="/">通常の分析へ</a></div></header>
<div class="layout"><aside><h2>分析の設定</h2><fieldset><legend>参加者</legend><div class="controls"><button id="all">全員</button><button id="none">解除</button></div><div id="participants" class="participants"></div></fieldset><fieldset><legend>条件</legend><div id="conditions"></div></fieldset><label class="field">フェーズ<select id="phase"><option value="practice">practice — 反復試行</option><option value="post">post — 事後試行</option></select></label><label class="field">MT・TPe・ERの対象区間<select id="scope"><option value="coreMtMs">core区間（coreMtMs）</option><option value="mtMs">全区間（mtMs）</option></select></label><label class="field">参加者の表示<select id="mode"><option value="individual">参加者ごとに色分け</option><option value="mean">参加者の等重み平均</option></select></label><fieldset><legend>分析する試行範囲</legend><label class="field">開始試行<input id="trialStart" type="number" min="1" step="1" value="1" required></label><label class="field">終了試行<input id="trialEnd" type="number" min="1" step="1" placeholder="空欄：最後まで"></label><p class="muted">指定範囲内の元の試行番号を使い、7モデルを再推定します。</p></fieldset><label class="field">推移の集計幅<select id="bin"><option value="10">10試行平均</option><option value="50">50試行平均</option><option value="100">100試行平均</option></select></label><label class="field">残差外れ値判定用の回帰式<select id="curveModel"><option value="shifted">T = A + B*(N + E)^(-a)</option><option value="power">T = A + B*N^(-a)（Eなし）</option></select></label><label class="field">残差外れ値判定用Aの制約<select id="aBound"><option value="nonnegative">A ≥ 0（既定）</option><option value="free">Aの制約なし（負の値を許容）</option><option value="fixed_core">core MTのAを条件別固定（84 / 253 / 315 ms）</option></select></label><label class="field">MT外れ値の除外<select id="mtOutlier"><option value="none">除外なし</option><option value="trial3sd">同一試行番号の平均MT ±3SD</option><option value="curve3sd">習熟曲線からの残差 ±3SD</option><option value="trial1_5sd">同一試行番号の平均MT ±1.5SD</option><option value="curve1_5sd">習熟曲線からの残差 ±1.5SD</option></select></label><label class="check"><input type="checkbox" id="exclude" checked>countedAsTrial=true かつ coreExitMsありの試行のみ採用</label><label class="check" style="margin-top:10px"><input type="checkbox" id="excludeBoundaryTrials">100・200・300試行の周辺10試行を分析から除外</label><p class="muted">MT外れ値、基本採用条件、境界周辺試行の設定は通常ページと同じ順序で全モデルへ適用します。</p><button id="run" class="primary">回帰を更新</button><button id="reload" style="width:100%;margin-top:10px">inputCSVを再読み込み</button></aside>
<main><div id="status" role="status" aria-live="polite"></div><div id="result"><div class="panel">practiceを選択すると、7種類のMT回帰を縦に表示します。</div></div></main></div>
<script>
let timer=null,generation=0,busy=false;
const $=id=>document.getElementById(id);
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function fmt(x){return x===null||x===undefined?'—':(Math.abs(Number(x))>=1e7?Number(x).toExponential(3):Number(x).toLocaleString('ja-JP',{maximumFractionDigits:5}))}
async function api(path,data){const response=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Error(result.error||'読み込みに失敗しました');return result}
function checked(id){return [...new Set([...$(id).querySelectorAll('input:checked')].map(e=>e.value))]}
function options(){for(const id of ['trialStart','trialEnd'])if(!$(id).checkValidity())throw Error('試行範囲は1以上の整数で指定してください');return {participants:checked('participants'),conditions:checked('conditions'),scope:$('scope').value,phase:$('phase').value,mode:$('mode').value,bin:Number($('bin').value),mtOutlier:$('mtOutlier').value,curveModel:$('curveModel').value,aBound:$('aBound').value,exclude:$('exclude').checked,excludeBoundaryTrials:$('excludeBoundaryTrials').checked,trialStart:Number($('trialStart').value),trialEnd:$('trialEnd').value===''?null:Number($('trialEnd').value)}}
function table(headers,rows){const box=node('div',undefined,'table-wrap'),t=node('table'),head=node('tr');headers.forEach(h=>head.append(node('th',h)));t.append(head);rows.forEach(row=>{const tr=node('tr');row.forEach(v=>tr.append(node('td',v)));t.append(tr)});box.append(t);return box}
function fill(meta,preserve=false){
  $('dataset').textContent=`${meta.files} files / ${meta.participants.length} participants / ${meta.rows.toLocaleString()} rows`;
  const oldParticipants=checked('participants'),selected=new Set(preserve?oldParticipants:meta.participants);$('participants').replaceChildren();
  meta.conditions.forEach(condition=>{const group=node('section',undefined,'participant-group'),list=node('div',undefined,'participant-list');group.append(node('h3',condition),list);(meta.participantsByCondition?.[condition]||[]).forEach(value=>{const label=node('label',undefined,'check'),input=node('input');input.type='checkbox';input.value=value;input.checked=selected.has(value);input.addEventListener('change',()=>{$('participants').querySelectorAll('input').forEach(peer=>{if(peer.value===value)peer.checked=input.checked});schedule()});label.append(input,document.createTextNode(value));list.append(label)});$('participants').append(group)});
  if(meta.unassignedParticipants?.length){const group=node('section',undefined,'participant-group'),list=node('div',undefined,'participant-list');group.append(node('h3','未割当'),list);meta.unassignedParticipants.forEach(value=>{const label=node('label',undefined,'check'),input=node('input');input.type='checkbox';input.value=value;input.checked=selected.has(value);input.addEventListener('change',schedule);label.append(input,document.createTextNode(value));list.append(label)});$('participants').append(group)}
  const oldConditions=checked('conditions');$('conditions').replaceChildren();meta.conditions.forEach(value=>{const label=node('label',undefined,'check'),input=node('input');input.type='checkbox';input.value=value;input.checked=preserve?oldConditions.includes(value):true;input.addEventListener('change',schedule);label.append(input,document.createTextNode(value));$('conditions').append(label)})
}
function render(r){const root=$('result');root.replaceChildren();root.classList.remove('stale');const cards=node('div',undefined,'cards');[['対象行',r.included],['除外行',r.excluded.length],['モデル数',r.regressionModels.length]].forEach(([label,value])=>{const card=node('div',undefined,'card');card.append(node('div',label,'muted'),node('div',String(value),'value'));cards.append(card)});root.append(cards);if(r.options.phase!=='practice'){root.append(node('div','回帰はpracticeデータだけを対象とします。','panel'));return}r.regressionModels.forEach(model=>{const section=node('section',undefined,'panel model'),head=node('div',undefined,'chart-head'),save=node('button','PNGを保存');save.onclick=async()=>{save.disabled=true;try{const out=await api('/api/save',{token:r.token,key:'regression_'+model.key});$('status').textContent='保存しました：'+out.path}catch(e){$('status').className='error';$('status').textContent=e.message}finally{save.disabled=false}};const heading=node('div');heading.append(node('h2',model.title),node('div',model.formula,'formula'));head.append(heading,save);const img=node('img');img.src='data:image/png;base64,'+r.charts['regression_'+model.key];img.alt=model.title;const chart=node('div',undefined,'chart');chart.append(img);section.append(head,chart);const fits=r.regressionFits[model.key],headers=['条件','参加者',...model.parameters,'R²','RMSE (ms)','点数','状態'];section.append(table(headers,fits.map(f=>[f.condition,f.participant,...model.parameters.map(p=>fmt(f.parameters?.[p])),fmt(f.r2),fmt(f.rmse),f.points||'—',f.ok?(f.warning||'収束'):f.message])));root.append(section)});const details=node('details',undefined,'panel');details.append(node('summary',`除外した試行（${r.excluded.length}行）`),table(['参加者','条件','試行','試行の試み','CSV','行番号','理由'],r.excluded.map(e=>[e.participant,e.condition,e.n,e.attempt,e.source,e.line,e.reason])));root.append(details)}
function schedule(){generation++;$('result').classList.add('stale');clearTimeout(timer);$('status').className='';$('status').textContent='設定が変わりました。「回帰を更新」を押してください。'}
async function run(){clearTimeout(timer);if(busy)return;busy=true;const version=generation;$('run').disabled=true;$('reload').disabled=true;$('status').className='';$('status').textContent='7モデルを回帰・描画中…';try{const r=await api('/api/regression',options());if(version===generation){render(r);$('status').textContent=r.included?'回帰を更新しました。':'選択に該当するデータがありません。'}}catch(e){if(version===generation){$('status').className='error';$('status').textContent=e.message;$('result').classList.add('stale')}}finally{busy=false;$('run').disabled=false;$('reload').disabled=false;if(version!==generation)$('status').textContent='設定が変わりました。「回帰を更新」を押してください。'}}
$('all').onclick=()=>{$('participants').querySelectorAll('input').forEach(e=>e.checked=true);schedule()};$('none').onclick=()=>{$('participants').querySelectorAll('input').forEach(e=>e.checked=false);schedule()};for(const id of ['scope','phase','mode','bin','mtOutlier','curveModel','aBound','exclude','excludeBoundaryTrials','trialStart','trialEnd'])$(id).onchange=schedule;$('run').onclick=run;$('reload').onclick=async()=>{clearTimeout(timer);generation++;$('result').classList.add('stale');$('reload').disabled=true;try{fill(await api('/api/reload',{}),true);schedule()}catch(e){$('status').className='error';$('status').textContent=e.message}finally{$('reload').disabled=false}};
api('/api/meta').then(meta=>{fill(meta);$('status').textContent='設定を確認して「回帰を更新」を押してください。'}).catch(e=>{$('status').className='error';$('status').textContent=e.message});
</script></html>
